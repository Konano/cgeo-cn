name: Build patched cgeo APK

on:
  workflow_dispatch:

  # push:
  #   branches:
  #     - patches

permissions:
  contents: read

concurrency:
  group: patched-cgeo-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Restore persistent debug keystore
        shell: bash
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "::error::DEBUG_KEYSTORE_BASE64 is not configured"
            exit 1
          fi

          mkdir -p "$HOME/.android"
          printf '%s' "$DEBUG_KEYSTORE_BASE64" \
            | base64 --decode \
            > "$HOME/.android/debug.keystore"

          chmod 600 "$HOME/.android/debug.keystore"

      - name: Apply c:geo CN branding
        shell: bash
        run: |
          sed -i \
            -e 's|@mipmap/ic_launcher_debug_round|@mipmap/ic_launcher_round|g' \
            -e 's|@mipmap/ic_launcher_debug|@mipmap/ic_launcher|g' \
            main/build.gradle

          sed -i \
            's|<string translatable="false" name="app_name">c:geo</string>|<string translatable="false" name="app_name">c:geo CN</string>|' \
            main/src/main/res/values/strings_not_translatable.xml

          if grep -q '@mipmap/ic_launcher_debug' main/build.gradle; then
            echo "::error::Failed to replace the debug launcher icon"
            exit 1
          fi

          grep -q '<string translatable="false" name="app_name">c:geo CN</string>' \
            main/src/main/res/values/strings_not_translatable.xml

      - name: Build BasicDebug APK
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleBasicDebug

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: cgeo-patched-apk
          path: main/build/outputs/apk/basic/debug/*.apk
          if-no-files-found: error
          retention-days: 30
