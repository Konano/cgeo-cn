name: Build c:geo CN release APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cgeo-cn-release-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Restore persistent debug keystore
        shell: bash
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "::error::DEBUG_KEYSTORE_BASE64 is not configured"
            exit 1
          fi

          mkdir -p "$HOME/.android"
          printf '%s' "$DEBUG_KEYSTORE_BASE64" \
            | base64 --decode \
            > "$HOME/.android/debug.keystore"

          chmod 600 "$HOME/.android/debug.keystore"

          keytool -list \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            > /dev/null

      - name: Configure c:geo CN release APK
        shell: bash
        run: |
          printf '%s\n' \
            "key.store=$HOME/.android/debug.keystore" \
            "key.alias=androiddebugkey" \
            "key.store.password=android" \
            "key.alias.password=android" \
            > private.properties

          sed -i \
            's|applicationId = "cgeo.geocaching"|applicationId = "cgeo.geocaching.cn"|' \
            main/build.gradle

          sed -i \
            's|<string translatable="false" name="app_name">c:geo</string>|<string translatable="false" name="app_name">c:geo CN</string>|' \
            main/src/main/res/values/strings_not_translatable.xml

          sed -i \
            's|<string translatable="false" name="file_provider_authority">org.cgeo.fileprovider</string>|<string translatable="false" name="file_provider_authority">cgeo.geocaching.cn.fileprovider</string>|' \
            main/src/main/res/values/strings_not_translatable.xml

          grep -q 'applicationId = "cgeo.geocaching.cn"' main/build.gradle
          grep -q "date.format('yyyy.MM.dd')" main/build.gradle
          grep -q "date.format('yyyyMMdd')" main/build.gradle
          grep -q '<string translatable="false" name="app_name">c:geo CN</string>' \
            main/src/main/res/values/strings_not_translatable.xml
          grep -q '<string translatable="false" name="file_provider_authority">cgeo.geocaching.cn.fileprovider</string>' \
            main/src/main/res/values/strings_not_translatable.xml

      - name: Build BasicRelease APK
        shell: bash
        env:
          TZ: Asia/Shanghai
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleBasicRelease

      - name: Verify APK metadata
        shell: bash
        run: |
          metadata_file="main/build/outputs/apk/basic/release/output-metadata.json"

          grep -q '"applicationId": "cgeo.geocaching.cn"' "$metadata_file"
          grep -Eq '"versionCode": [0-9]{8}' "$metadata_file"
          grep -Eq '"versionName": "[0-9]{4}\.[0-9]{2}\.[0-9]{2}"' "$metadata_file"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: cgeo-cn-release-apk
          path: main/build/outputs/apk/basic/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Install ossutil
        shell: bash
        env:
          OSSUTIL_URL: https://gosspublic.alicdn.com/ossutil/1.7.19/ossutil-v1.7.19-linux-amd64.zip
          OSSUTIL_SHA256: dcc512e4a893e16bbee63bc769339d8e56b21744fd83c8212a9d8baf28767343
        run: |
          archive="$RUNNER_TEMP/ossutil.zip"
          install_dir="$RUNNER_TEMP/ossutil-v1.7.19-linux-amd64"

          curl --fail --location --retry 3 \
            --output "$archive" \
            "$OSSUTIL_URL"

          echo "$OSSUTIL_SHA256  $archive" | sha256sum --check -
          unzip -q "$archive" -d "$RUNNER_TEMP"
          chmod +x "$install_dir/ossutil"
          echo "$install_dir" >> "$GITHUB_PATH"

      - name: Upload APK to Aliyun OSS
        shell: bash
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_SECRET }}
          TZ: Asia/Shanghai
        run: |
          if [ -z "$OSS_ACCESS_KEY_ID" ] \
            || [ -z "$OSS_ACCESS_KEY_SECRET" ]; then
            echo "::error::Aliyun OSS credentials are not configured"
            exit 1
          fi

          shopt -s nullglob
          apk_files=(main/build/outputs/apk/basic/release/*.apk)

          if [ "${#apk_files[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one release APK, found ${#apk_files[@]}"
            exit 1
          fi

          config_file="$RUNNER_TEMP/ossutilconfig"
          printf '%s\n' \
            "[Credentials]" \
            "language=EN" \
            "endpoint=https://oss-cn-beijing.aliyuncs.com" \
            "accessKeyID=$OSS_ACCESS_KEY_ID" \
            "accessKeySecret=$OSS_ACCESS_KEY_SECRET" \
            > "$config_file"
          chmod 600 "$config_file"

          dated_target="oss://nanoweb/geocaching/cgeo_cn/cgeo-cn-$(date +'%Y%m%d').apk"
          release_target="oss://nanoweb/geocaching/cgeo_cn/cgeo-cn-release.apk"

          ossutil -c "$config_file" cp "${apk_files[0]}" "$dated_target" --force
          ossutil -c "$config_file" cp "${apk_files[0]}" "$release_target" --force
