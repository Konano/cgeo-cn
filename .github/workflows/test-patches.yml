name: Test patches branch

on:
  push:
    branches:
      - patches

permissions:
  contents: read

concurrency:
  group: test-patches-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Run BasicDebug unit tests
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon testBasicDebugUnitTest
